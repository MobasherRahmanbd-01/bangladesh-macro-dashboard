name: update-data (Option 2, no LLM)

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch World Bank + build summary
        run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/annual.json data/summary.json
          git diff --cached --quiet || (git commit -m "auto: update annual $(date -u +%F)" && git push)
